<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Iniciar sesión · Laboratorio Biomédico</title>
  <meta name="theme-color" content="#101014">
  <link rel="icon" type="image/png" href="assets/brand/uadeo.png">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="assets/tema-claro.css"><link rel="stylesheet" href="assets/tema-boton.css"><script src="assets/js/tema.js"></script>
</head>
<body class="login-body">
  <main class="panel login-card">
    <div class="brand">
      <span class="university-logo"><img src="assets/brand/uadeo.png" alt="UAdeO — Universidad Autónoma de Occidente" width="233" height="274"></span>
      <span>LABORATORIO<small>BIOMÉDICO / GESTIÓN INTEGRAL</small></span>
    </div>
    <p class="eyebrow">CIENCIAS BIOMÉDICAS</p>
    <h1>Iniciar sesión</h1>
    <p class="muted" style="margin:8px 0 24px">Cada recurso en su lugar. Cada decisión, con información.</p>

    <form id="form-login" autocomplete="on" novalidate>
      <label class="campo">Usuario<input id="usuario" name="usuario" type="text" maxlength="40" autocomplete="username" autocapitalize="none" placeholder="Tu usuario o matrícula"></label>
      <label class="campo">Contraseña<input id="password" name="password" type="password" autocomplete="current-password"></label>

      <p id="error" class="form-error" role="alert" hidden></p>
      <button id="btn-entrar" class="button primary" type="submit">Entrar</button>
    </form>
  </main>

  <script src="assets/js/api.js"></script>
  <script>
    document.body.appendChild(Tema.boton("tema-flotante"));
    const previa = Sesion.obtener();
    if (previa && previa.token) location.replace(previa.rol === 'alumno' ? 'practicas.html' : 'index.html');

    const $form = document.getElementById('form-login');
    const $error = document.getElementById('error');

    // Todos los roles entran con usuario y contraseña
    $form.addEventListener('submit', async (e) => {
      e.preventDefault();
      $error.hidden = true;
      const mostrarError = (m) => { $error.textContent = m; $error.hidden = false; };
      const usuario = $form.usuario.value.trim();
      const password = $form.password.value;
      if (!usuario || !password) return mostrarError('Escribe tu usuario y contraseña.');
      const btn = document.getElementById('btn-entrar');
      btn.disabled = true;
      try {
        const r = await api('/auth/login', { method: 'POST', body: { usuario, password } });
        // El rol sale de la cuenta: cada quien entra directo a su espacio
        Sesion.guardar({ rol: r.usuario.rol, nombre: r.usuario.nombre, usuario: r.usuario.usuario, token: r.token });
        location.href = r.usuario.rol === 'alumno' ? 'practicas.html' : 'index.html';
      } catch (err) {
        mostrarError(err.message);
        $form.password.value = '';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
